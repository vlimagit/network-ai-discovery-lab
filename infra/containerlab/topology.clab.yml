name: network-ai-discovery

mgmt:
  network: network-ai-discovery-mgmt
  ipv4-subnet: 172.30.211.0/24

# Containerlab uses the image built by scripts/lab-start.sh.
topology:
  kinds:
    linux:
      image: network-ai-discovery/linux-router:0.1
  nodes:
    linux-r1:
      kind: linux
      mgmt-ipv4: 172.30.211.240
      binds:
        - ../../.lab/ssh/id_ed25519.pub:/run/lab-ssh/authorized_key.pub:ro
    linux-r2:
      kind: linux
      mgmt-ipv4: 172.30.211.241
      binds:
        - ../../.lab/ssh/id_ed25519.pub:/run/lab-ssh/authorized_key.pub:ro
    linux-r3:
      kind: linux
      mgmt-ipv4: 172.30.211.242
      binds:
        - ../../.lab/ssh/id_ed25519.pub:/run/lab-ssh/authorized_key.pub:ro
    cisco-r4:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:17.18.02
      mgmt-ipv4: 172.30.211.243
      startup-config: cisco/r4.partial.cfg
    nokia-r5:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux@sha256:0096fe3ebcafabb7253492e2060425fe027a168e0e066766d1e85efbb0b48be8
      type: ixrd2
      mgmt-ipv4: 172.30.211.244
  links:
    - endpoints: ["linux-r1:eth1", "linux-r2:eth1"]
    - endpoints: ["linux-r2:eth2", "linux-r3:eth1"]
    - endpoints: ["linux-r3:eth2", "cisco-r4:Ethernet0/1"]
    - endpoints: ["cisco-r4:Ethernet0/2", "linux-r1:eth2"]
    - endpoints: ["linux-r1:eth3", "nokia-r5:e1-1"]
    - endpoints: ["linux-r2:eth3", "nokia-r5:e1-2"]
